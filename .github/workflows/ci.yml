name: Update ASN and IP List

on: 
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # Every day at 10:00 UTC->2:00 +0800 CST

jobs:
  build: 
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: 3.8

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Run python to generate ASN and IP list
        id: generate
        run: |
          python main.py

      # - name: Check generate result
      #   run: |
      #       if [[ "${{ steps.generate.outputs.generate_result }}" == "success" ]];
      #       then
      #         echo "Data Generate Success, start release process."
      #       else 
      #         echo "Data Generate Failed, please check the log."
      #         exit 1
      #       fi

      - name: Create release
        if: steps.generate.outputs.generate_result == 'success'
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.date.outputs.date }}
          name: ASN-IP-Data-${{ steps.date.outputs.date }}
          draft: false
          allow_override: true
          body: |
            [${{ steps.date.outputs.date }}] auto generated ASN and IP list result.
            download url:https://github.com/${{ github.repository }}/releases/download/${{ steps.date.outputs.date }}/${{ steps.generate.outputs.release_file }}
          gzip: false
          files: ${{ steps.generate.outputs.release_file_path }}

      - name: Delete old releases and workflows
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 5
          gh_token: ${{ secrets.GITHUB_TOKEN }}